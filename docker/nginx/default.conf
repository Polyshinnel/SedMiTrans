server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /storage/ {
        alias /var/www/storage/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /up { try_files /__laravel_route__ @laravel; }
    location ~ ^/(api|admin|livewire|horizon)(/|$) { try_files /__laravel_route__ @laravel; }

    # Laravel's public assets stay local; all application pages belong to Next.js.
    location ~ ^/(?:build|css|js|fonts)/ {
        try_files $uri @frontend;
        access_log off;
        expires 1h;
    }
    location = /favicon.ico { try_files $uri @frontend; }
    location = /robots.txt { try_files $uri @frontend; }

    location ~ \.php$ { return 404; }
    location / { try_files /__frontend_route__ @frontend; }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_pass app:9000;
    }

    location @frontend {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass http://frontend:3000;
    }
}
