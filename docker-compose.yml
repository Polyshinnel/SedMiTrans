services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-28180}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - storage_public:/var/www/storage:ro
    depends_on:
      app:
        condition: service_started
      frontend:
        condition: service_started

  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    working_dir: /var/www/html
    command: php-fpm -F
    env_file: .env
    volumes:
      - .:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - storage_public:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  horizon:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    working_dir: /var/www/html
    command: php artisan horizon
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - storage_public:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    working_dir: /var/www/html
    command: php artisan schedule:work
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - storage_public:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    working_dir: /app
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://nginx/api/v1}
      MEDIA_INTERNAL_URL: ${MEDIA_INTERNAL_URL:-http://nginx}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:28180}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sedmitrans}
      MYSQL_USER: ${DB_USERNAME:-sedmitrans}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sedmitrans}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-23307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/local.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-26380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  redis_data:
  storage_public:
  backend_vendor:
  frontend_node_modules:
